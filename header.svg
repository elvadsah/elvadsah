<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Header profil" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Grid titik halus -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e1e1e"/>
    </pattern>

    <!-- Kilau pink yang menyapu teks -->
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#ffffff"/>
      <stop offset="0.5"  stop-color="#3b8cff"/>
      <stop offset="0.58" stop-color="#ffffff"/>
      <stop offset="1"    stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-560 0; 560 0; 560 0" keyTimes="0; 0.6; 1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b8cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b8cff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="round"><rect width="1000" height="280" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="#000000"/>
    <rect width="1000" height="280" fill="url(#dots)"/>

    <!-- Cahaya lembut di belakang orbit -->
    <circle cx="750" cy="140" r="150" fill="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- ============ SISI KIRI: TEKS ============ -->
    <!-- Status -->
    <g font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="13" letter-spacing="2.5">
      <circle cx="66" cy="66" r="4" fill="#3b8cff">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="66" cy="66" r="4" fill="none" stroke="#3b8cff" stroke-width="1.5">
        <animate attributeName="r" values="4;13" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="84" y="71" fill="#8a8a8a" opacity="0">
        OPEN TO COLLABORATE
        <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.3s" fill="freeze"/>
      </text>
    </g>

    <!-- Nama -->
    <text x="60" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="76" font-weight="800" letter-spacing="-2" fill="url(#shine)" opacity="0">
      Nama Kamu
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.5s" fill="freeze"/>
    </text>

    <!-- Garis bawah yang tergambar sendiri -->
    <path d="M62 184 H430" stroke="#3b8cff" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="368" stroke-dashoffset="368" fill="none">
      <animate attributeName="stroke-dashoffset" from="368" to="0" dur="1.3s" begin="1s"
               fill="freeze" calcMode="spline" keySplines="0.65 0 0.35 1" keyTimes="0;1"/>
    </path>
    <circle cx="446" cy="184" r="4" fill="#3b8cff" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.2s" fill="freeze"/>
    </circle>

    <!-- Subjudul -->
    <text x="62" y="228" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace"
          font-size="17" fill="#9a9a9a" letter-spacing="1.5" opacity="0">
      Software Developer  /  Problem Solver  /  Lifelong Learner
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.8s" fill="freeze"/>
    </text>

    <!-- ============ SISI KANAN: ORBIT ============ -->
    <g>
      <!-- garis silang tipis -->
      <path d="M620 140 H880 M750 10 V270" stroke="#1f1f1f" stroke-width="1"/>

      <!-- cincin luar -->
      <g>
        <circle cx="750" cy="140" r="104" fill="none" stroke="#3b8cff" stroke-width="1.5"
                stroke-dasharray="3 9" opacity="0.7"/>
        <circle cx="750" cy="36" r="6" fill="#3b8cff"/>
        <animateTransform attributeName="transform" type="rotate"
                          from="0 750 140" to="360 750 140" dur="22s" repeatCount="indefinite"/>
      </g>

      <!-- cincin tengah -->
      <g>
        <circle cx="750" cy="140" r="70" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
        <circle cx="820" cy="140" r="4" fill="#ffffff"/>
        <animateTransform attributeName="transform" type="rotate"
                          from="360 750 140" to="0 750 140" dur="14s" repeatCount="indefinite"/>
      </g>

      <!-- cincin dalam -->
      <g>
        <circle cx="750" cy="140" r="38" fill="none" stroke="#3b8cff" stroke-width="1"
                stroke-dasharray="60 30" opacity="0.9"/>
        <animateTransform attributeName="transform" type="rotate"
                          from="0 750 140" to="360 750 140" dur="8s" repeatCount="indefinite"/>
      </g>

      <!-- inti -->
      <circle cx="750" cy="140" r="14" fill="#3b8cff">
        <animate attributeName="r" values="14;17;14" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="750" cy="140" r="5" fill="#000000"/>
    </g>

    <!-- Bingkai tipis -->
    <rect x="1" y="1" width="998" height="278" rx="19" fill="none" stroke="#1d1d1d" stroke-width="2"/>
  </g>
</svg>
