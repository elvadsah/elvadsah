<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Header profil" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#1a1040;#0f0c29" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e">
        <animate attributeName="stop-color" values="#24243e;#3a1c71;#24243e" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ee8fa"/>
      <stop offset="50%" stop-color="#c471f5"/>
      <stop offset="100%" stop-color="#fa71cd"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="260" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>

    <!-- Bintang berkedip -->
    <g fill="#ffffff">
      <circle cx="80"  cy="45"  r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="190" cy="100" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="310" cy="35"  r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="450" cy="70"  r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="30"  r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="90"  r="1.3"><animate attributeName="opacity" values="1;0.1;1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="42"  r="1.7"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="110" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Bola cahaya melayang -->
    <circle cx="150" cy="150" r="46" fill="#7ee8fa" opacity="0.10">
      <animate attributeName="cy" values="150;120;150" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="r" values="46;54;46" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="130" r="60" fill="#fa71cd" opacity="0.10">
      <animate attributeName="cy" values="130;95;130" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="r" values="60;70;60" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="170" r="34" fill="#c471f5" opacity="0.12">
      <animate attributeName="cx" values="500;540;500" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- Gelombang 3 lapis (bergerak mulus) -->
    <path fill="#7ee8fa" opacity="0.18" d="M0,205 q125,-40 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path fill="#c471f5" opacity="0.25" d="M0,220 q125,-34 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="#fa71cd" opacity="0.35" d="M0,236 q125,-26 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- Teks -->
    <g text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="500" y="112" font-size="54" font-weight="700" fill="url(#title)" opacity="0">
        Halo, Saya Nama Kamu
        <animate attributeName="opacity" from="0" to="1" dur="1.6s" begin="0.2s" fill="freeze"/>
        <animate attributeName="y" values="130;112" dur="1.6s" begin="0.2s" fill="freeze"/>
      </text>
      <text x="500" y="154" font-size="20" fill="#e6e6ff" opacity="0" letter-spacing="3">
        SOFTWARE DEVELOPER  •  PROBLEM SOLVER  •  LIFELONG LEARNER
        <animate attributeName="opacity" from="0" to="0.9" dur="1.6s" begin="1s" fill="freeze"/>
      </text>
    </g>
  </g>
</svg>
