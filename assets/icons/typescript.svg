<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <defs>
    <clipPath id="cardClip">
      <rect width="64" height="64" rx="14" />
    </clipPath>
    <style>
      @keyframes softFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes softPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 1px rgba(255,255,255,0.2)); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 6px rgba(56,189,248,0.5)); }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes softWiggle {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-4deg); }
        75% { transform: rotate(4deg); }
      }
      @keyframes softJump {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-3.5px) rotate(3deg); }
      }
      @keyframes waveRipple {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-2px) scale(1.04); }
      }
      @keyframes sheenMove {
        0% { transform: translateX(-70px) skewX(-20deg); }
        35%, 100% { transform: translateX(90px) skewX(-20deg); }
      }
      .anim-float { animation: softFloat 2.8s ease-in-out infinite; }
      .anim-pulse { transform-origin: 32px 32px; animation: softPulse 2.4s ease-in-out infinite; }
      .anim-spin { transform-origin: 32px 32px; animation: spinSlow 8s linear infinite; }
      .anim-wiggle { transform-origin: 32px 36px; animation: softWiggle 3s ease-in-out infinite; }
      .anim-jump { transform-origin: 32px 32px; animation: softJump 2.6s ease-in-out infinite; }
      .anim-wave { transform-origin: 32px 32px; animation: waveRipple 2.6s ease-in-out infinite; }
      .anim-sheen { animation: sheenMove 3.2s ease-in-out infinite; }
    </style>
  </defs>
  <g clip-path="url(#cardClip)">
    <rect width="64" height="64" rx="14" fill="#151d28" stroke="#334155" stroke-width="1.5" />
    <g class="anim-float">
      <g transform="translate(12.00, 12.00) scale(0.3125)">
<path fill="#fff" d="M22.67 47h99.67v73.67H22.67z"/><path data-name="original" fill="#007acc" d="M1.5 63.91v62.5h125v-125H1.5zm100.73-5a15.56 15.56 0 017.82 4.5 20.58 20.58 0 013 4c0 .16-5.4 3.81-8.69 5.85-.12.08-.6-.44-1.13-1.23a7.09 7.09 0 00-5.87-3.53c-3.79-.26-6.23 1.73-6.21 5a4.58 4.58 0 00.54 2.34c.83 1.73 2.38 2.76 7.24 4.86 8.95 3.85 12.78 6.39 15.16 10 2.66 4 3.25 10.46 1.45 15.24-2 5.2-6.9 8.73-13.83 9.9a38.32 38.32 0 01-9.52-.1 23 23 0 01-12.72-6.63c-1.15-1.27-3.39-4.58-3.25-4.82a9.34 9.34 0 011.15-.73L82 101l3.59-2.08.75 1.11a16.78 16.78 0 004.74 4.54c4 2.1 9.46 1.81 12.16-.62a5.43 5.43 0 00.69-6.92c-1-1.39-3-2.56-8.59-5-6.45-2.78-9.23-4.5-11.77-7.24a16.48 16.48 0 01-3.43-6.25 25 25 0 01-.22-8c1.33-6.23 6-10.58 12.82-11.87a31.66 31.66 0 019.49.26zm-29.34 5.24v5.12H56.66v46.23H45.15V69.26H28.88v-5a49.19 49.19 0 01.12-5.17C29.08 59 39 59 51 59h21.83z"/>
      </g>
    </g>
  </g>
</svg>