<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <defs>
    <clipPath id="cardClip">
      <rect width="64" height="64" rx="14" />
    </clipPath>
    <style>
      @keyframes softFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes softPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 1px rgba(255,255,255,0.2)); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 6px rgba(56,189,248,0.5)); }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes softWiggle {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-4deg); }
        75% { transform: rotate(4deg); }
      }
      @keyframes softJump {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-3.5px) rotate(3deg); }
      }
      @keyframes waveRipple {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-2px) scale(1.04); }
      }
      @keyframes sheenMove {
        0% { transform: translateX(-70px) skewX(-20deg); }
        35%, 100% { transform: translateX(90px) skewX(-20deg); }
      }
      .anim-float { animation: softFloat 2.8s ease-in-out infinite; }
      .anim-pulse { transform-origin: 32px 32px; animation: softPulse 2.4s ease-in-out infinite; }
      .anim-spin { transform-origin: 32px 32px; animation: spinSlow 8s linear infinite; }
      .anim-wiggle { transform-origin: 32px 36px; animation: softWiggle 3s ease-in-out infinite; }
      .anim-jump { transform-origin: 32px 32px; animation: softJump 2.6s ease-in-out infinite; }
      .anim-wave { transform-origin: 32px 32px; animation: waveRipple 2.6s ease-in-out infinite; }
      .anim-sheen { animation: sheenMove 3.2s ease-in-out infinite; }
    </style>
  </defs>
  <g clip-path="url(#cardClip)">
    <rect width="64" height="64" rx="14" fill="#151d28" stroke="#334155" stroke-width="1.5" />
    <g class="anim-pulse">
      <g transform="translate(12.00, 12.00) scale(1.2500)">
        <circle cx="16" cy="16" r="14" fill="#0369a1" fill-opacity="0.25"/>
        <circle cx="16" cy="16" r="11" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
        <rect x="15" y="2" width="2" height="3.5" rx="1" fill="#38bdf8"/>
        <rect x="15" y="26.5" width="2" height="3.5" rx="1" fill="#38bdf8"/>
        <rect x="2" y="15" width="3.5" height="2" rx="1" fill="#38bdf8"/>
        <rect x="26.5" y="15" width="3.5" height="2" rx="1" fill="#38bdf8"/>
        <rect x="5.5" y="5.5" width="2.2" height="3" rx="1" fill="#38bdf8" transform="rotate(-45 6.6 7)"/>
        <rect x="24.3" y="5.5" width="2.2" height="3" rx="1" fill="#38bdf8" transform="rotate(45 25.4 7)"/>
        <rect x="5.5" y="23.5" width="2.2" height="3" rx="1" fill="#38bdf8" transform="rotate(45 6.6 25)"/>
        <rect x="24.3" y="23.5" width="2.2" height="3" rx="1" fill="#38bdf8" transform="rotate(-45 25.4 25)"/>
        <text x="16" y="19" font-family="'Segoe UI', -apple-system, sans-serif" font-size="7.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">REST</text>
        <path d="M 8 13 C 9.5 13 9.5 15 9.5 16 C 9.5 17 9.5 19 8 19" stroke="#7dd3fc" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <path d="M 24 13 C 22.5 13 22.5 15 22.5 16 C 22.5 17 22.5 19 24 19" stroke="#7dd3fc" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>