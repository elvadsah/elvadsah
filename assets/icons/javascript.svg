<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <defs>
    <clipPath id="cardClip">
      <rect width="64" height="64" rx="14" />
    </clipPath>
    <style>
      @keyframes softFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes softPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 1px rgba(255,255,255,0.2)); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 6px rgba(56,189,248,0.5)); }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes softWiggle {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-4deg); }
        75% { transform: rotate(4deg); }
      }
      @keyframes softJump {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-3.5px) rotate(3deg); }
      }
      @keyframes waveRipple {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-2px) scale(1.04); }
      }
      @keyframes sheenMove {
        0% { transform: translateX(-70px) skewX(-20deg); }
        35%, 100% { transform: translateX(90px) skewX(-20deg); }
      }
      .anim-float { animation: softFloat 2.8s ease-in-out infinite; }
      .anim-pulse { transform-origin: 32px 32px; animation: softPulse 2.4s ease-in-out infinite; }
      .anim-spin { transform-origin: 32px 32px; animation: spinSlow 8s linear infinite; }
      .anim-wiggle { transform-origin: 32px 36px; animation: softWiggle 3s ease-in-out infinite; }
      .anim-jump { transform-origin: 32px 32px; animation: softJump 2.6s ease-in-out infinite; }
      .anim-wave { transform-origin: 32px 32px; animation: waveRipple 2.6s ease-in-out infinite; }
      .anim-sheen { animation: sheenMove 3.2s ease-in-out infinite; }
    </style>
  </defs>
  <g clip-path="url(#cardClip)">
    <rect width="64" height="64" rx="14" fill="#151d28" stroke="#334155" stroke-width="1.5" />
    <g class="anim-float">
      <g transform="translate(12.00, 12.00) scale(0.3125)">
<path fill="#F0DB4F" d="M1.408 1.408h125.184v125.185H1.408z"/><path fill="#323330" d="M116.347 96.736c-.917-5.711-4.641-10.508-15.672-14.981-3.832-1.761-8.104-3.022-9.377-5.926-.452-1.69-.512-2.642-.226-3.665.821-3.32 4.784-4.355 7.925-3.403 2.023.678 3.938 2.237 5.093 4.724 5.402-3.498 5.391-3.475 9.163-5.879-1.381-2.141-2.118-3.129-3.022-4.045-3.249-3.629-7.676-5.498-14.756-5.355l-3.688.477c-3.534.893-6.902 2.748-8.877 5.235-5.926 6.724-4.236 18.492 2.975 23.335 7.104 5.332 17.54 6.545 18.873 11.531 1.297 6.104-4.486 8.08-10.234 7.378-4.236-.881-6.592-3.034-9.139-6.949-4.688 2.713-4.688 2.713-9.508 5.485 1.143 2.499 2.344 3.63 4.26 5.795 9.068 9.198 31.76 8.746 35.83-5.176.165-.478 1.261-3.666.38-8.581zM69.462 58.943H57.753l-.048 30.272c0 6.438.333 12.34-.714 14.149-1.713 3.558-6.152 3.117-8.175 2.427-2.059-1.012-3.106-2.451-4.319-4.485-.333-.584-.583-1.036-.667-1.071l-9.52 5.83c1.583 3.249 3.915 6.069 6.902 7.901 4.462 2.678 10.459 3.499 16.731 2.059 4.082-1.189 7.604-3.652 9.448-7.401 2.666-4.915 2.094-10.864 2.07-17.444.06-10.735.001-21.468.001-32.237z"/>
