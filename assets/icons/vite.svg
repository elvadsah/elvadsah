<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <defs>
    <clipPath id="cardClip">
      <rect width="64" height="64" rx="14" />
    </clipPath>
    <style>
      @keyframes softFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes softPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 1px rgba(255,255,255,0.2)); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 6px rgba(56,189,248,0.5)); }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes softWiggle {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-4deg); }
        75% { transform: rotate(4deg); }
      }
      @keyframes softJump {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-3.5px) rotate(3deg); }
      }
      @keyframes waveRipple {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-2px) scale(1.04); }
      }
      @keyframes sheenMove {
        0% { transform: translateX(-70px) skewX(-20deg); }
        35%, 100% { transform: translateX(90px) skewX(-20deg); }
      }
      .anim-float { animation: softFloat 2.8s ease-in-out infinite; }
      .anim-pulse { transform-origin: 32px 32px; animation: softPulse 2.4s ease-in-out infinite; }
      .anim-spin { transform-origin: 32px 32px; animation: spinSlow 8s linear infinite; }
      .anim-wiggle { transform-origin: 32px 36px; animation: softWiggle 3s ease-in-out infinite; }
      .anim-jump { transform-origin: 32px 32px; animation: softJump 2.6s ease-in-out infinite; }
      .anim-wave { transform-origin: 32px 32px; animation: waveRipple 2.6s ease-in-out infinite; }
      .anim-sheen { animation: sheenMove 3.2s ease-in-out infinite; }
    </style>
  </defs>
  <g clip-path="url(#cardClip)">
    <rect width="64" height="64" rx="14" fill="#151d28" stroke="#334155" stroke-width="1.5" />
    <g class="anim-jump">
      <g transform="translate(12.00, 12.00) scale(0.3125)">
<defs><linearGradient id="a" x1="6" x2="235" y1="33" y2="344" gradientTransform="translate(0 .937) scale(.3122)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#41d1ff"/><stop offset="1" stop-color="#bd34fe"/></linearGradient><linearGradient id="b" x1="194.651" x2="236.076" y1="8.818" y2="292.989" gradientTransform="translate(0 .937) scale(.3122)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffea83"/><stop offset=".083" stop-color="#ffdd35"/><stop offset="1" stop-color="#ffa800"/></linearGradient></defs><path fill="url(#a)" d="M124.766 19.52 67.324 122.238c-1.187 2.121-4.234 2.133-5.437.024L3.305 19.532c-1.313-2.302.652-5.087 3.261-4.622L64.07 25.187a3.09 3.09 0 0 0 1.11 0l56.3-10.261c2.598-.473 4.575 2.289 3.286 4.594Zm0 0"/><path fill="url(#b)" d="M91.46 1.43 48.954 9.758a1.56 1.56 0 0 0-1.258 1.437l-2.617 44.168a1.563 1.563 0 0 0 1.91 1.614l11.836-2.735a1.562 1.562 0 0 1 1.88 1.836l-3.517 17.219a1.562 1.562 0 0 0 1.985 1.805l7.308-2.223c1.133-.344 2.223.652 1.985 1.812l-5.59 27.047c-.348 1.692 1.902 2.614 2.84 1.164l.625-.968 34.64-69.13c.582-1.16-.421-2.48-1.69-2.234l-12.185 2.352a1.558 1.558 0 0 1-1.793-1.965l7.95-27.562A1.56 1.56 0 0 0 91.46 1.43Zm0 0"/>
      </g>
    </g>
  </g>
</svg>