name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # otomatis update setiap 12 jam
  workflow_dispatch:          # bisa dijalankan manual
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake (ekor bertambah panjang)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/snake.py --user "${{ github.repository_owner }}" --out dist/github-snake.svg

      - name: Push ke branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
